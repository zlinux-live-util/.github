<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="zlinux-live-util">
  <title>zlinux-live-util</title>
  <!--
    Org avatar source. GitHub displays avatars as circles, so the background is
    full-bleed and the mark stays inside the inscribed circle (r=256).

    The mark says both halves of what this org is: a display (the stream, which
    leaves as video) driven by a shell prompt (native Linux tooling, not an
    embedded browser). Depth comes from a faint radial glow behind the mark —
    an outline ring was tried first and dropped: at avatar sizes it read as a
    loading spinner and competed with the monitor.

    Palette follows pw-mpris-visualcard: a #16171c-family ground with white
    accents. Glyph geometry is composed from Lucide (ISC) — the "monitor" frame
    and the square-terminal prompt — see ATTRIBUTION.md for the notices.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1e26"/>
      <stop offset="1" stop-color="#111218"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>
  <rect width="512" height="512" fill="url(#lift)"/>

  <!-- display (screen + stand) with a shell prompt on it -->
  <g transform="translate(100 94) scale(13)" fill="none" stroke="#f4f4f5" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <path d="M12 17v4"/>
    <path d="M8 21h8"/>
    <path d="m6.5 8 2.5 2.5-2.5 2.5"/>
    <path d="M12 13h5"/>
  </g>
</svg>
